<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transactions | Smart ID Wallet</title>

    <link
        rel="stylesheet"
        href="css/transactions.css">

</head>


<body>

<div class="transactions-page">

    <!-- ================================
         HEADER
         ================================ -->

    <header class="transactions-header">

        <button
            class="back-btn"
            onclick="goBack()">

            ←

        </button>


        <div class="header-content">

            <h1>
                Transactions
            </h1>

            <p>
                Your wallet activity
            </p>

        </div>

    </header>



    <!-- ================================
         MAIN
         ================================ -->

    <main>


        <!-- ============================
             SUMMARY
             ============================ -->

        <section class="summary-card">

            <div class="summary-left">

                <span class="summary-label">
                    Total Transactions
                </span>

                <h2 id="transactionCount">
                    0
                </h2>

                <span class="summary-subtitle">
                    Wallet activity
                </span>

            </div>


            <div class="summary-icon">
                🧾
            </div>

        </section>



        <!-- ============================
             FILTER BUTTONS
             ============================ -->

        <section class="filter-section">

            <button
                class="filter-btn active"
                onclick="filterTransactions('ALL', this)">

                All

            </button>


            <button
                class="filter-btn"
                onclick="filterTransactions('CREDIT', this)">

                Money Added

            </button>


            <button
                class="filter-btn"
                onclick="filterTransactions('DEBIT', this)">

                Payments

            </button>

        </section>



        <!-- ============================
             TITLE
             ============================ -->

        <div class="title-row">

            <h2>
                Transaction History
            </h2>

            <span id="transactionTotal">
                0 transactions
            </span>

        </div>



        <!-- ============================
             TRANSACTION LIST
             ============================ -->

        <section
            id="transactionList"
            class="transaction-list">

            <div class="loading">

                <div class="loading-spinner"></div>

                <p>
                    Loading transactions...
                </p>

            </div>

        </section>



        <!-- ============================
             BACK BUTTON
             ============================ -->

        <button
            class="dashboard-btn"
            onclick="goBack()">

            ← Back to Dashboard

        </button>

    </main>

</div>



<script src="js/transactions.js"></script>

</body>

</html>
