<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | Smart ID Wallet</title>
    <link rel="stylesheet" href="css/history.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <header class="header">
            <button type="button" class="back-btn" onclick="window.location.href='dashboard.html'" aria-label="Back">
                ←
            </button>
            <div class="header-title">
                <h1>Transactions</h1>
                <p>Complete Wallet Activity</p>
            </div>
            <div class="header-icon">📜</div>
        </header>

        <main class="history-container">

            <!-- SUMMARY STATS -->
            <section class="history-summary-grid">
                <div class="stat-box">
                    <span class="stat-label">Available Balance</span>
                    <strong class="stat-val text-accent" id="summaryBalance">₹0.00</strong>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Total Transactions</span>
                    <strong class="stat-val" id="summaryCount">0</strong>
                </div>
            </section>

            <!-- FILTER CHIPS -->
            <section class="filter-tabs">
                <button type="button" class="filter-tab active" data-filter="ALL" onclick="filterTransactions('ALL', this)">
                    All Activity
                </button>
                <button type="button" class="filter-tab" data-filter="DEBIT" onclick="filterTransactions('DEBIT', this)">
                    🛒 Purchases
                </button>
                <button type="button" class="filter-tab" data-filter="CREDIT" onclick="filterTransactions('CREDIT', this)">
                    💳 Top-ups
                </button>
            </section>

            <!-- TRANSACTION LIST -->
            <section class="transaction-list-section">
                <div class="list-header">
                    <h3 id="listTitle">Recent Records</h3>
                    <span class="count-badge" id="listBadge">0 records</span>
                </div>

                <div class="transactions-container" id="transactionsList">
                    <div class="loading-state">Loading ledger records...</div>
                </div>
            </section>

        </main>

        <!-- DETAILED TRANSACTION RECEIPT MODAL -->
        <div class="detail-modal" id="detailModal" style="display: none;">
            <div class="modal-backdrop" onclick="closeDetailModal()"></div>
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Transaction Receipt</h3>
                    <button type="button" class="close-btn" onclick="closeDetailModal()">✕</button>
                </div>

                <div class="modal-body" id="modalReceiptBody">
                    <!-- Populated dynamically by js/history.js -->
                </div>

                <div class="modal-footer">
                    <button type="button" class="modal-close-btn" onclick="closeDetailModal()">Close Receipt</button>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="window.location.href='dashboard.html'">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </button>
            <button type="button" class="nav-item active" onclick="window.location.href='history.html'">
                <span class="nav-icon">🧾</span>
                <span class="nav-label">History</span>
            </button>
            <button type="button" class="nav-item" onclick="window.location.href='my-id.html'">
                <span class="nav-icon">🪪</span>
                <span class="nav-label">My ID</span>
            </button>
            <button type="button" class="nav-item" onclick="window.location.href='profile.html'">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </button>
        </nav>

    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>

</body>

</html>
