<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My College ID - Smart ID Wallet</title>

    <link rel="stylesheet" href="css/my-id.css">

</head>

<body>

<div class="id-page">

    <header class="id-header">

        <button onclick="goBack()" class="back-btn">
            ←
        </button>

        <div>
            <h1>My College ID</h1>
            <p>Smart Digital Identity</p>
        </div>

    </header>


    <main>

        <section class="college-id-card">

            <div class="card-top">

                <div>
                    <p class="college-name">
                        SMART COLLEGE
                    </p>

                    <p class="card-title">
                        STUDENT IDENTITY CARD
                    </p>
                </div>

                <div class="card-logo">
                    🎓
                </div>

            </div>


            <div class="student-section">

                <div class="student-photo">
                    👤
                </div>


                <div class="student-details">

                    <h2 id="studentName">
                        Student
                    </h2>

                    <p>
                        <strong>Student ID</strong>
                        <span id="studentId">--</span>
                    </p>

                    <p>
                        <strong>Department</strong>
                        <span id="department">--</span>
                    </p>

                    <p>
                        <strong>Academic Year</strong>
                        <span id="academicYear">--</span>
                    </p>

                </div>

            </div>


            <div class="barcode">

                <div class="barcode-lines">
                    || ||| || |||| | ||| || || ||
                </div>

                <span id="barcodeId">
                    --
                </span>

            </div>

        </section>


        <div class="id-info">

            <div class="info-box">

                <span>🔐</span>

                <div>
                    <strong>Digital ID</strong>
                    <p>Your college identity is securely stored.</p>
                </div>

            </div>


            <div class="info-box">

                <span>📱</span>

                <div>
                    <strong>Smart Wallet</strong>
                    <p>Use your student ID with your digital wallet.</p>
                </div>

            </div>

        </div>


        <button
            class="dashboard-btn"
            onclick="goBack()">

            ← Back to Dashboard

        </button>

    </main>

</div>


<script src="js/my-id.js"></script>

</body>

</html>
