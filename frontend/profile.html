<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Smart ID Wallet</title>
    <link rel="stylesheet" href="css/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <header class="header">
            <button type="button" class="back-btn" onclick="window.location.href='dashboard.html'" aria-label="Back">
                ←
            </button>
            <div class="header-title">
                <h1>My Profile</h1>
                <p>Campus Identity & Security</p>
            </div>
            <div class="header-icon">👤</div>
        </header>

        <main class="profile-container">

            <!-- PROFILE HERO CARD -->
            <section class="profile-hero-card">
                <div class="avatar-large">👤</div>
                <h2 id="profileName">Student Name</h2>
                <span class="profile-id-tag" id="profileStudentId">--</span>
                <p class="profile-dept-sub" id="profileDept">Department of Engineering</p>
            </section>

            <!-- EDIT DETAILS CARD -->
            <section class="form-card">
                <div class="card-title-row">
                    <span>✏️</span>
                    <h3>Personal Information</h3>
                </div>

                <form id="profileForm" onsubmit="event.preventDefault(); updateProfile();">
                    <div class="input-group">
                        <label for="nameInput">Full Name</label>
                        <input type="text" id="nameInput" placeholder="Enter Full Name" required>
                    </div>

                    <div class="input-group">
                        <label for="emailInput">Campus Email</label>
                        <input type="email" id="emailInput" placeholder="student@campus.edu">
                    </div>

                    <div class="input-group">
                        <label for="deptInput">Department</label>
                        <input type="text" id="deptInput" readonly style="background:#f1f5f9; cursor:not-allowed;">
                    </div>

                    <div class="input-group">
                        <label for="yearInput">Academic Batch</label>
                        <input type="text" id="yearInput" readonly style="background:#f1f5f9; cursor:not-allowed;">
                    </div>

                    <div class="input-group">
                        <label for="roleInput">Account Role</label>
                        <input type="text" id="roleInput" readonly style="background:#f1f5f9; cursor:not-allowed;" value="Student">
                    </div>

                    <button type="submit" class="submit-btn" id="saveProfileBtn">
                        Save Changes
                    </button>
                </form>
            </section>

            <!-- CHANGE PASSWORD CARD -->
            <section class="form-card">
                <div class="card-title-row">
                    <span>🔐</span>
                    <h3>Change Password</h3>
                </div>

                <form id="passwordForm" onsubmit="event.preventDefault(); updatePassword();">
                    <div class="input-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" placeholder="Enter current password" required>
                    </div>

                    <div class="input-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" minlength="6" required>
                    </div>

                    <button type="submit" class="submit-btn secondary" id="changePassBtn">
                        Update Password
                    </button>
                </form>
            </section>

            <!-- LOGOUT BUTTON -->
            <button type="button" class="logout-btn" onclick="Auth.logout()">
                <span>🚪</span> Sign Out of Wallet
            </button>

        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="window.location.href='dashboard.html'">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </button>
            <button type="button" class="nav-item" onclick="window.location.href='history.html'">
                <span class="nav-icon">🧾</span>
                <span class="nav-label">History</span>
            </button>
            <button type="button" class="nav-item" onclick="window.location.href='my-id.html'">
                <span class="nav-icon">🪪</span>
                <span class="nav-label">My ID</span>
            </button>
            <button type="button" class="nav-item active" onclick="window.location.href='profile.html'">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </button>
        </nav>

    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
